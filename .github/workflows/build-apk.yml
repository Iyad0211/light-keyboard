name: Build keyboard APK

# Builds the installable keyboard app (English, Arabic, and English + Arabic) on every push to
# main, and publishes it as the latest GitHub Release, so the newest APK is always at:
#   https://github.com/<owner>/light-keyboard/releases/latest/download/LP3-Keyboard-EN-AR.apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :ui:testDebugUnitTest --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LP3-Keyboard-EN-AR.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LP3-Keyboard-EN-AR
          path: dist/LP3-Keyboard-EN-AR.apk

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Keyboard build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: dist/LP3-Keyboard-EN-AR.apk
